name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 集成测试（连通性）仅手动触发，见下方 integration job
  workflow_dispatch:

jobs:
  quality:
    name: 质量门禁（语法+规范+单元测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 语法检查（全项目 py_compile）
        run: |
          find scripts tests -name "*.py" -print0 | xargs -0 python -m py_compile
          echo "语法检查通过"

      - name: 编码规范检查（禁裸 except / 禁直接 requests 调用）
        run: |
          set -e
          # 1. 无裸 except（except: 单独出现视为违规）
          BARE=$(grep -rnP 'except\s*:' scripts/ --include='*.py' | grep -vP 'except\s+Exception' || true)
          if [ -n "$BARE" ]; then
            echo "发现裸 except（违规，应改为 except Exception）:"
            echo "$BARE"
            exit 1
          fi
          # 2. 禁止直接 requests.get/post（应封装 Session 且带 trust_env=False）
          DIRECT=$(grep -rnP 'requests\.(get|post)\(' scripts/ --include='*.py' || true)
          if [ -n "$DIRECT" ]; then
            echo "发现直接 requests.get/post 调用（应封装 Session 并设 trust_env=False）:"
            echo "$DIRECT"
            exit 1
          fi
          echo "编码规范检查通过"

      # 主入口检查：scripts/ 下非库脚本必须含 if __name__ == '__main__'。
      # 豁免清单 LIB_ALLOWLIST（纯库模块）定义在 scripts/tools/check_main_entry.py，
      # 每个豁免项均注明「被 import 使用、顶层无副作用」依据；
      # 新增豁免必须同步补充理由，防止滥豁免掩盖顶层副作用。
      - name: 主入口检查（scripts/ 非库脚本必须含 __main__）
        run: |
          python scripts/tools/check_main_entry.py

      - name: ruff 静态检查（bug 类规则 E9/F63/F7/F82/E722）
        run: |
          pip install ruff
          ruff check scripts tests

      - name: mypy 类型检查（核心纯函数模块）
        run: |
          pip install mypy
          mypy

      - name: 单元测试（纯函数，无网络依赖）
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # config/ 已被 gitignore，CI 中不存在；创建占位配置供 test_config_loads 使用
          mkdir -p config
          echo '{"token": "placeholder_for_ci"}' > config/tushare_config.json
          python -m pytest tests/test_core_functions.py tests/test_data_validator.py tests/test_data_gate.py -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # 集成测试（连通性）— 手动触发，不属于常规质量门禁
  # 原因：需外网访问国内数据源（腾讯/东财等），GitHub Runner 网络
  #       不保证可达；Tushare 需真实 Token（GitHub Secrets 未配置）。
  # 触发：GitHub Actions 页面 → Run workflow（手动选择 main）
  # ─────────────────────────────────────────────────────────────
  integration:
    name: 集成测试（数据源连通性·手动触发）
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: 核心数据源连通性测试（腾讯行情，无鉴权）
        run: python tests/test_a_stock.py

      - name: Tushare Pro 连通性测试（需真实 Token，失败不阻断）
        run: python tests/test_tushare_pro.py || echo "Tushare 测试跳过（无 Token 或网络受限）"
        continue-on-error: true
